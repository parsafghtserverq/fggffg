name: Ubuntu Cloud Desktop (Tailscale + XRDP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # حداکثر زمان مجاز برای اکانت‌های رایگان گیت‌هاب (۶ ساعت)

    steps:
      - name: 1. Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          # نصب محیط دسکتاپ سبک XFCE و سرور ریموت دسکتاپ
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          
          # فعال‌سازی و شروع سرویس xrdp
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          
          # تنظیم XFCE به عنوان محیط پیش‌فرض برای اتصالات ریموت
          echo "xfce4-session" > ~/.xsession
          sudo cp ~/.xsession /etc/skel/
          sudo sed -i '0,/-1/s//ask-1/' /etc/xrdp/xrdp.ini

      - name: 2. Set User Password
        run: |
          # تنظیم رمز عبور برای کاربر پیش‌فرض ubuntu
          echo "ubuntu:P@ssw0rd1qazXSW@#" | sudo chpasswd
          # اطمینان از دسترسی کاربر به فایل‌های پیکربندی
          sudo adduser ubuntu ssl-cert

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # دانلود و نصب اسکریپت رسمی Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # اتصال به شبکه Tailscale
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-ubuntu-desktop"
          
          sleep 5
          
          # دریافت آی‌پی Tailscale
          TS_IP=$(tailscale ip -4)
          
          echo ""
          echo "==========================================================" 
          echo "  >>> UBUNTU DESKTOP IS READY! <<<" 
          echo "  Tailscale IP : $TS_IP" 
          echo "  Username     : ubuntu" 
          echo "  Password     : P@ssw0rd1qazXSW@#" 
          echo "  >> Open mstsc (Remote Desktop) and connect to: $TS_IP" 
          echo "==========================================================" 

      - name: 4. Keep Server Alive
        run: |
          for i in {1..2880}; do
            echo "[$i/2880] Server running..."
            sleep 60
          done
