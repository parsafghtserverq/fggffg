name: Ubuntu Cloud Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install Desktop & XRDP
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfce4 xfce4-goodies xrdp dbus-x11 x11-xserver-utils > /dev/null 2>&1

          echo "xfce4-session" > ~/.xsession
          chmod +x ~/.xsession
          sudo cp ~/.xsession /etc/skel/

          sudo sed -i 's|^test -x /etc/X11/Xsession.*|#&|' /etc/xrdp/startwm.sh
          echo "startxfce4" | sudo tee -a /etc/xrdp/startwm.sh > /dev/null

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: 2. Set Password
        run: |
          sudo sed -i 's/password\s\+requisite\s\+pam_pwquality.so/#&/' /etc/pam.d/common-password 2>/dev/null || true
          sudo usermod -p "$(openssl passwd -6 'P@ssw0rd1qazXSW@#')" ubuntu
          sudo adduser ubuntu ssl-cert 2>/dev/null || true

      - name: 3. Install Tailscale & Connect
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="ubuntu-rdp"
          sleep 5
          TS_IP=$(tailscale ip -4)

          echo ""
          echo "============================================"
          echo "  UBUNTU DESKTOP IS READY"
          echo "============================================"
          echo "  IP       : $TS_IP"
          echo "  Username : ubuntu"
          echo "  Password : P@ssw0rd1qazXSW@#"
          echo "  Port     : 3389"
          echo "============================================"

      - name: 4. Keep Alive
        run: |
          while true; do
            echo "[$(date)] Server running..."
            sleep 60
          done
